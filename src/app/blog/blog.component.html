<div class="form-container">
  <div class="form-card">
    <h3>{{ isEditMode ? 'Edit Blog' : 'Create a New Blog' }}</h3>
    <form (ngSubmit)="onSubmit()" #blogForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="selectedBlog.username"
          name="username"
          placeholder="Enter your username"
          required
          #username="ngModel"
        />
        <span class="error" *ngIf="formSubmitted && username.invalid">Username is required</span>
      </div>
      <div class="form-group">
        <label for="blogpost">Blog Post</label>
        <textarea
          id="blogpost"
          [(ngModel)]="selectedBlog.blogpost"
          name="blogpost"
          placeholder="Write your blog post here..."
          required
          #blogpost="ngModel"
        ></textarea>
        <span class="error" *ngIf="formSubmitted && blogpost.invalid">Blog post is required</span>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="selectedBlog.email"
          name="email"
          placeholder="Enter your email"
          required
          email
          #email="ngModel"
        />
        <span class="error" *ngIf="formSubmitted && email.invalid">
          {{ email.errors?.['required'] ? 'Email is required' : 'Invalid email format' }}
        </span>
      </div>
      <div class="form-group">
        <label for="category">Category</label>
        <select
          id="category"
          [(ngModel)]="selectedBlog.category"
          name="category"
          required
          #category="ngModel"
        >
          <option value="" disabled>Select a category</option>
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
        </select>
        <span class="error" *ngIf="formSubmitted && category.invalid">Category is required</span>
      </div>
      <div class="form-group checkbox-group">
        <input
          type="checkbox"
          id="terms"
          [(ngModel)]="selectedBlog.terms"
          name="terms"
        />
        <label for="terms">I agree to the terms</label>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
        <button type="button" class="btn-secondary" (click)="resetForm()">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
